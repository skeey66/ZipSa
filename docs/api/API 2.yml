  # ────────────────────────────────────────────────────────────
  # AI — 정책·뉴스 상세의 「AI 요약」 + 「나에게 어떻게 적용되나」
  # ────────────────────────────────────────────────────────────
  /api/ai/policies/{policyId}:
    get:
      tags: [AI]
      operationId: getPolicyInsight
      summary: 정책 AI 요약 + 내 적용 (POLICY-005)
      description: |
        **로그인 필요** — 「나에게 어떻게 적용되나」가 회원 조건(나이·직업·소득·지역)을 쓰기 때문입니다.
        비로그인에게는 화면에서 이 영역을 **감춥니다**(401 을 띄우지 않습니다).

        `aiGenerated` 로 출처를 구분합니다.
        `true` = LLM 생성(배지 「AI」) / `false` = 규칙 기반 목업(배지 「샘플」).
        `OPENAI_API_KEY` 가 없거나 LLM 호출이 실패하면 **예외 대신 규칙 기반으로 폴백**하므로,
        정의돼 있는 `AI_SUMMARY_FAILED(503)` 은 현재 실제로는 나가지 않습니다.
        결과는 (종류·글·회원) 조합으로 서버 메모리에 최대 500건 캐시됩니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `policyId` 가 숫자가 아님 |
        | 401 | `INVALID_TOKEN` / `TOKEN_EXPIRED` | 토큰 문제 |
        | 404 | `POLICY_NOT_FOUND` | 없는 정책 |
        | 404 | `USER_NOT_FOUND` | 토큰의 회원이 삭제됨 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
        | 503 | `AI_SUMMARY_FAILED` | (예약) LLM 실패를 폴백하지 않기로 바꿀 경우 |
      security: [{ bearerAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: integer, format: int64, example: 312 }
      responses:
        '200':
          description: 요약 + 적용
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiInsightResponseEnvelope' }
              examples:
                ruleBased:
                  summary: 규칙 기반 폴백 (키 미설정)
                  value:
                    success: true
                    data:
                      summary:
                        - 만 19~39세 무주택 세대주가 대상입니다.
                        - 전월세보증금 대출 이자 중 연 2% 이내를 최대 2년간 지원합니다.
                        - 신청은 2026년 9월 27일까지입니다.
                      application:
                        verdict: 신청 조건에 해당합니다. 마감 전에 서류를 준비하세요.
                        reasons: [나이대(20대 후반)가 대상 범위에 듭니다, 연소득 3,000~4,000만원이 4천만원 이하 조건을 만족합니다, 거주지가 관악구로 일치합니다]
                        nextSteps: [무주택 확인을 위한 주민등록등본 발급, 임대차계약서 사본 준비, 정부24에서 온라인 신청]
                        tone: good
                      aiGenerated: false
                    error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

