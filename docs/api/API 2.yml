      summary: 지역 목록 (오퍼레이션 36)
      description: |
        인증 불필요. 화면 11 좌측 필터용. `hasData` 는 그 지역에 수집된 실거래가 있는지로,
        false 인 칩은 눌러도 빈 지도만 나오므로 화면에서 비활성 처리합니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      responses:
        '200':
          description: 지역 목록
