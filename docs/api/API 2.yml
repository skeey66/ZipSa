        '200':
          description: 뉴스 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageNewsResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/news/{newsId}:
    get:
