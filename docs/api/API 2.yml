            application/json:
              schema: { $ref: '#/components/schemas/RegionListEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/transactions/map:
    get:
      tags: [Transaction]
      operationId: getTransactionMarkers
      summary: 실거래 지도 마커 — 아파트 집계 (오퍼레이션 37)
      description: |
        인증 불필요. 금액 단위는 **만원**입니다(화면에서 억/만원으로 포맷).

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `dealType` 이 Enum 에 없는 값, `months` 가 숫자가 아님 |
        | 404 | `REGION_NOT_FOUND` | 존재하지 않는 지역코드 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      parameters:
        - name: regionCode
          in: query
          required: true
          description: 법정동코드 5자리
          schema: { type: string, example: "11620" }
        - name: dealType
          in: query
          required: false
          schema: { allOf: [{ $ref: '#/components/schemas/DealType' }], default: SALE }
        - name: months
          in: query
          required: false
          description: 최근 N개월치 집계
          schema: { type: integer, default: 12, minimum: 1, maximum: 60 }
      responses:
        '200':
          description: 아파트 단위 마커
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapMarkerListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/transactions:
    get:
      tags: [Transaction]
      operationId: getTransactions
      summary: 실거래 목록 (오퍼레이션 38)
      description: |
        인증 불필요. 마커 클릭 시 그 단지(`aptName`)로 좁혀 호출합니다.
        `dealType=MONTHLY` 일 때만 `monthlyRent` 가 채워집니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `dealType` 이 Enum 에 없는 값, `page`/`size` 가 숫자가 아님 |
        | 404 | `REGION_NOT_FOUND` | 존재하지 않는 지역코드 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      parameters:
        - name: regionCode
          in: query
          required: true
          schema: { type: string, example: "11620" }
        - name: dealType
          in: query
          required: false
          schema: { allOf: [{ $ref: '#/components/schemas/DealType' }], default: SALE }
        - name: aptName
          in: query
          required: false
          description: 단지명 정확 일치 (마커 클릭)
          schema: { type: string, example: 관악드림타운 }
        - name: keyword
          in: query
          required: false
          description: 단지명 부분 일치 (검색창)
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 실거래 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageTransactionResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

