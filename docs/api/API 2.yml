  # Loan — 화면 14. 개인 조건을 쓰므로 전부 로그인 필수
  # ────────────────────────────────────────────────────────────
  /api/loans/prediction:
    get:
      tags: [Loan]
      operationId: predictLoan
      summary: 은행별 한도 분포 + 내 예상 한도 + 분석레포트
      description: |
        **로그인 필요.** 회원들이 실제로 등록한 승인 이력(`loan_actuals`)을 5천만원 단위 6구간으로 센 분포입니다.
        0번 칸은 「반려」이고, 금액 구간은 1번부터 시작합니다.

        `report.aiGenerated` 가 `false` 면 **규칙 기반 목업**입니다. 화면은 이 값으로 「샘플」 배지를 붙여
        AI 가 쓴 글로 오해되지 않게 합니다. `OPENAI_API_KEY` 가 설정되면 자동으로 `true` 가 됩니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 401 | `INVALID_TOKEN` / `TOKEN_EXPIRED` | 토큰 문제 |
        | 404 | `USER_NOT_FOUND` | 회원 없음 |
        | 404 | `NOT_FOUND_LOAN_SAMPLE` | 등록된 대출 표본이 하나도 없음 (분포를 만들 수 없음) |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 예측 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPredictionResponseEnvelope' }
              examples:
                default:
                  value:
                    success: true
                    data:
                      profile:
                        nickname: 집구하는청년
                        ageRange: 20대 후반
                        job: 직장인
                        salaryRange: 3,000~4,000만원
                        maritalStatus: 미혼
                      buckets: [반려, 0.5억 미만, 0.5~1억, 1~1.5억, 1.5~2억, 2억 이상]
                      banks:
                        - bankName: KB국민은행
                          theme: amber
                          distribution: [3, 12, 41, 28, 9, 2]
                          highlightIndex: 3
                          expectedLimit: 128000000
                          expectedRate: 3.62
                          sampleSize: 95
                          note: 나이 · 직업 · 연봉 기준 산출
                        - bankName: 우리은행
                          theme: blue
                          distribution: [5, 18, 33, 21, 6, 1]
                          highlightIndex: 2
                          expectedLimit: 96000000
                          expectedRate: 3.85
                          sampleSize: 84
                          note: 나이 · 직업 · 연봉 기준 산출
                      report:
                        headline: 20대 후반 직장인 · 연소득 3,000~4,000만원 기준 최대 1.28억까지 기대할 수 있습니다
                        insights:
                          - KB국민은행이 같은 조건에서 가장 높은 한도를 보였습니다 (표본 95건)
                          - 금리는 우리은행이 0.23%p 높습니다
                          - 표본의 8%는 반려됐습니다. 소득 증빙을 먼저 확인하세요
                        recommendedBank: KB국민은행
                        disclaimer: 회원들이 등록한 실제 승인 이력을 바탕으로 한 추정치입니다. 실제 심사 결과와 다를 수 있습니다.
                        aiGenerated: false
                    error: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

