  # ────────────────────────────────────────────────────────────
  # Community — 화면 08. 조회는 비로그인 허용, 쓰기는 로그인 필요
  # ────────────────────────────────────────────────────────────
  /api/posts:
    get:
      tags: [Community]
      operationId: getPosts
      summary: 게시글 목록 (오퍼레이션 21)
      description: |
        인증 불필요. `badges` 는 대출 결과를 등록한 회원에게 붙는 은행 코드 배열(`KB`/`WOORI`/`NH`/`HANA`)입니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `category` 가 Enum 에 없는 값, `page`/`size` 가 숫자가 아님 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      parameters:
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PostCategory' }
        - name: keyword
          in: query
          required: false
          description: 제목·내용 부분 일치
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 게시글 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagePostSummaryResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Community]
      operationId: writePost
      summary: 게시글 작성 (오퍼레이션 23)
      description: |
        **로그인 필요.**

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | 제목 공백·200자 초과, 내용 공백, 카테고리 미선택 |
        | 401 | `INVALID_TOKEN` / `TOKEN_EXPIRED` | 토큰 문제 |
        | 404 | `USER_NOT_FOUND` | 작성자 계정 없음 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostRequest' }
            examples:
              default:
                value:
                  title: 관악구 전세대출 후기 남깁니다
                  content: 지난주에 승인받았습니다. 조건은 아래와 같습니다...
                  category: LOAN
      responses:
        '201':
          description: 작성 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostIdEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/posts/popular:
    get:
      tags: [Community]
      operationId: getPopularPosts
      summary: 인기글 (화면 01 메인)
      description: |
        인증 불필요. 좋아요·조회수 기준 상위 N건.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `size` 가 숫자가 아님 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: 인기글 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostSummaryListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/posts/{postId}:
    get:
      tags: [Community]
      operationId: getPost
      summary: 게시글 상세 (오퍼레이션 22)
      description: |
        **인증 선택.** 비로그인도 볼 수 있으며, 그때는 `liked` · `mine` 이 항상 `false` 입니다.
        조회 시 조회수가 증가합니다.

        | 상태 | code | 발생 조건 |
        | --- | --- | --- |
        | 400 | `INVALID_INPUT` | `postId` 가 숫자가 아님 |
        | 404 | `POST_NOT_FOUND` | 없는 글 · 삭제된 글 |
        | 500 | `INTERNAL_ERROR` | 예기치 못한 예외 |
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: 게시글 상세 + 댓글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetailResponseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

    patch:
      tags: [Community]
      operationId: editPost
      summary: 게시글 수정 (오퍼레이션 24)
      description: |
        **로그인 필요 + 본인 글만.** 성공 시 `data` 는 `null` 입니다.

